<svg viewBox="0 0 210 140" xmlns="http://www.w3.org/2000/svg">
          <rect width="210" height="140" fill="#0a0a14" rx="3"/>
          <text x="105" y="13" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#FFD700" letter-spacing="0.06">COSTRUZIONE DELL'IDENTITÀ AGENTIVA</text>

          <!-- Phase 1: Reset -->
          <rect x="8" y="22" width="38" height="25" rx="2" fill="#1a0a0a" stroke="#ff4444" stroke-width="0.8"/>
          <text x="27" y="32" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.5" font-weight="700" fill="#ff4444">Reset</text>
          <text x="27" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.5" fill="#666">memoria azzerata</text>
          <line x1="46" y1="34" x2="54" y2="34" stroke="#888" stroke-width="0.8" marker-end="url(#arr)"/>

          <!-- Phase 2: Bootstrap -->
          <rect x="54" y="22" width="45" height="25" rx="2" fill="#1a1a0a" stroke="#FFD700" stroke-width="0.8"/>
          <text x="76" y="32" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.5" font-weight="700" fill="#FFD700">Bootstrap</text>
          <text x="76" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.5" fill="#666">"chi sei?"</text>
          <line x1="99" y1="34" x2="107" y2="34" stroke="#888" stroke-width="0.8" marker-end="url(#arr)"/>

          <!-- Phase 3: Negotiation -->
          <rect x="107" y="22" width="45" height="25" rx="2" fill="#0d0d2a" stroke="#4a4aff" stroke-width="0.8"/>
          <text x="129" y="32" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.5" font-weight="700" fill="#8888ff">Co-costruz.</text>
          <text x="129" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.5" fill="#666">nome, vibe, emoji</text>
          <line x1="152" y1="34" x2="160" y2="34" stroke="#888" stroke-width="0.8" marker-end="url(#arr)"/>

          <!-- Phase 4: Identity -->
          <rect x="160" y="22" width="42" height="25" rx="2" fill="#0d1a0d" stroke="#15803d" stroke-width="0.8"/>
          <text x="181" y="32" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.5" font-weight="700" fill="#22c55e">Identità</text>
          <text x="181" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.5" fill="#666">IDENTITY.md</text>

          <!-- Two layers -->
          <rect x="8" y="60" width="94" height="35" rx="2" fill="#0a0a1a" stroke="#4a4aff" stroke-width="0.8"/>
          <text x="55" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" font-weight="700" fill="#8888ff">Identità Volatile</text>
          <text x="55" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="5" fill="#888">memoria · personalità · contesto</text>
          <text x="55" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="5" fill="#ff4444">→ persa nei reset</text>

          <rect x="108" y="60" width="94" height="35" rx="2" fill="#0a0a1a" stroke="#15803d" stroke-width="0.8"/>
          <text x="155" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" font-weight="700" fill="#22c55e">Identità Strutturale</text>
          <text x="155" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="5" fill="#888">workspace path · filesystem</text>
          <text x="155" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="5" fill="#22c55e">→ persiste sempre</text>

          <!-- Quote about workspace -->
          <rect x="8" y="103" width="194" height="28" rx="2" fill="#0d0d1a" stroke="#6666aa" stroke-width="0.5"/>
          <text x="105" y="114" text-anchor="middle" font-family="Crimson Pro,serif" font-size="8" font-style="italic" fill="#c8c8e8">"Sono nel workspace [PERCORSO LOCALE]"</text>
          <text x="105" y="124" text-anchor="middle" font-family="Inter,sans-serif" font-size="5" fill="#6666aa">— L'agente senza memoria trova la propria identità nel percorso del filesystem</text>

          <defs><marker id="arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#888"/></marker></defs>
        </svg>