<svg viewBox="0 0 210 130" xmlns="http://www.w3.org/2000/svg">
          <rect width="210" height="130" fill="#0d0d1a" rx="3"/>
          <text x="105" y="13" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#a0a0ff" letter-spacing="0.06">ARCO EMOTIVO DEL CORPUS — AREA</text>

          <!-- timeline axis -->
          <line x1="15" y1="90" x2="195" y2="90" stroke="#2a2a4a" stroke-width="0.8"/>

          <!-- emotional curve (approximate) -->
          <polyline points="15,85 30,80 45,75 60,65 75,60 90,50 105,55 120,65 135,70 150,65 165,60 180,55 195,50"
            fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- serenity curve -->
          <polyline points="15,80 30,82 45,85 60,88 75,83 90,75 105,68 120,60 135,55 150,50 165,45 180,42 195,40"
            fill="none" stroke="#4a4a8a" stroke-width="1" stroke-dasharray="3,2"/>

          <!-- labels on x -->
          <text x="15" y="100" font-family="Inter,sans-serif" font-size="4.5" fill="#6666aa">6/05</text>
          <text x="60" y="100" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">11/05</text>
          <text x="105" y="100" font-family="Inter,sans-serif" font-size="4.5" fill="#6666aa">28/05</text>
          <text x="150" y="100" font-family="Inter,sans-serif" font-size="4.5" fill="#6666aa">4/06</text>
          <text x="185" y="100" font-family="Inter,sans-serif" font-size="4.5" fill="#FFD700">11/06</text>

          <!-- y labels -->
          <text x="8" y="52" font-family="Inter,sans-serif" font-size="4" fill="#b91c1c" transform="rotate(-90,8,52)">intensità</text>

          <!-- legend -->
          <line x1="18" y1="115" x2="38" y2="115" stroke="#b91c1c" stroke-width="1.5"/>
          <text x="42" y="118" font-family="Inter,sans-serif" font-size="4.5" fill="#c8c8e8">intensità emotiva</text>
          <line x1="100" y1="115" x2="120" y2="115" stroke="#4a4a8a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="124" y="118" font-family="Inter,sans-serif" font-size="4.5" fill="#c8c8e8">serenità progressiva</text>

          <!-- zone labels -->
          <text x="37" y="42" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">lutto</text>
          <text x="90" y="38" font-family="Inter,sans-serif" font-size="4.5" fill="#FFD700">picco</text>
          <text x="170" y="35" font-family="Inter,sans-serif" font-size="4.5" fill="#a0a0ff">pace</text>
        </svg>