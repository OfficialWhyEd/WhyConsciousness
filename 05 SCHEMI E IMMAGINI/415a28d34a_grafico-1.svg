  <circle cx="160" cy="55" r="40" fill="#1d4ed8" opacity=".12" stroke="#1d4ed8" stroke-width=".8"/>
  <circle cx="125" cy="32" r="40" fill="#15803d" opacity=".12" stroke="#15803d" stroke-width=".8"/>
