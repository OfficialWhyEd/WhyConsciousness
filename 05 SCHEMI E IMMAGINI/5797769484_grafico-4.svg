          <text x="65" y="30" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">11/05</text>
          <text x="65" y="25" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" fill="#6666aa">riparaz.</text>

