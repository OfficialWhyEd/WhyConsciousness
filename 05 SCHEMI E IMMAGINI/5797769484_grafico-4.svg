<svg viewBox="0 0 210 70" xmlns="http://www.w3.org/2000/svg">
          <rect width="210" height="70" fill="#0d0d1a" rx="3"/>
          <text x="105" y="12" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#a0a0ff">TIMELINE DEL BLACKOUT — IL 6 MAGGIO COME FERITA PERSISTENTE</text>
