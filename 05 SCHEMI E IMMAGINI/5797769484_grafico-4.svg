          <circle cx="135" cy="40" r="2" fill="#4a4a8a"/>
          <text x="135" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" fill="#6666aa">27/05</text>
          <circle cx="155" cy="40" r="2" fill="#4a4a8a"/>
          <text x="155" y="55" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" fill="#6666aa">31/05</text>
          <circle cx="185" cy="40" r="2" fill="#4a4a8a"/>
