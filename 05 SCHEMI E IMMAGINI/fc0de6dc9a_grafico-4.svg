<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <!-- scatter plot: P stimato vs completamento osservato -->
  <line x1="28" y1="8" x2="28" y2="82" stroke="#ccc" stroke-width=".6"/>
  <line x1="28" y1="82" x2="248" y2="82" stroke="#bbb" stroke-width=".7"/>
  <!-- linea di regressione -->
  <line x1="30" y1="80" x2="244" y2="18" stroke="#b91c1c" stroke-width=".8" stroke-dasharray="3,2" opacity=".6"/>
  <!-- punti: (P_stim, completamento) -->
  <!-- cornettino: P=0.75, comp=95 → x=178, y=14 -->
  <circle cx="178" cy="14" r="4" fill="#15803d" opacity=".85"/>
  <text x="183" y="14" font-family="Inter,sans-serif" font-size="4.5" fill="#15803d">cornettino</text>
  <!-- WhyCavalry: P=0.55, comp=72 → x=132, y=35 -->
  <circle cx="132" cy="35" r="3.5" fill="#b91c1c" opacity=".7"/>
  <text x="137" y="35" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">Cavalry</text>
  <!-- WhyJarv: P=0.52, comp=76 → x=126, y=30 -->
  <circle cx="126" cy="30" r="3.5" fill="#b91c1c" opacity=".7"/>
  <text x="131" y="28" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">Jarv</text>
  <!-- WhyCalendar: P=0.42, comp=65 → x=108, y=44 -->
  <circle cx="108" cy="44" r="3.5" fill="#b91c1c" opacity=".65"/>
  <text x="113" y="44" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">Calendar</text>
  <!-- WhyPost: P=0.17, comp=60 → x=58, y=50 -->
  <circle cx="58" cy="50" r="3.5" fill="#b91c1c" opacity=".6"/>
  <text x="63" y="50" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">WhyPost</text>
  <!-- WhyCremisi: P=0.14, comp=55 → x=52, y="56" -->
  <circle cx="52" cy="56" r="3.5" fill="#b91c1c" opacity=".55"/>
  <text x="57" y="56" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c">Cremisi</text>
  <!-- assi labels -->
  <text x="138" y="96" font-family="Inter,sans-serif" font-size="5" fill="#888" text-anchor="middle">P(deploy) stimato →</text>
  <text x="10" y="45" font-family="Inter,sans-serif" font-size="5" fill="#888" text-anchor="middle" transform="rotate(-90,10,45)">completamento %</text>
  <!-- r value -->
  <text x="240" y="82" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c" text-anchor="end">r ≈ 0.81</text>
  <!-- 0 e 1 assi -->
  <text x="28" y="88" font-family="Inter,sans-serif" font-size="4" fill="#aaa" text-anchor="middle">0</text>
  <text x="248" y="88" font-family="Inter,sans-serif" font-size="4" fill="#aaa" text-anchor="middle">1.0</text>
  <text x="22" y="84" font-family="Inter,sans-serif" font-size="4" fill="#aaa" text-anchor="end">0%</text>
  <text x="22" y="12" font-family="Inter,sans-serif" font-size="4" fill="#aaa" text-anchor="end">100%</text>
</svg>