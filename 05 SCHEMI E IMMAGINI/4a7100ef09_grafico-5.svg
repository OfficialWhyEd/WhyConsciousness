<svg viewBox="0 0 262 105" xmlns="http://www.w3.org/2000/svg">
  <!-- grafo interdipendenza: nodi e archi -->
  <!-- nodi centrali -->
  <circle cx="131" cy="52" r="10" fill="#b91c1c" opacity=".15" stroke="#b91c1c" stroke-width="1"/>
  <text x="131" y="50" font-family="Inter,sans-serif" font-size="4.5" fill="#b91c1c" text-anchor="middle" font-weight="600">OpenClaw</text>
  <text x="131" y="57" font-family="Inter,sans-serif" font-size="3.5" fill="#b91c1c" text-anchor="middle">infra AI</text>
  <!-- nodi secondari -->
  <!-- WhyCremisi -->
  <circle cx="60" cy="28" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
  <text x="60" y="27" font-family="Inter,sans-serif" font-size="4" fill="#555" text-anchor="middle">Cremisi</text>
  <text x="60" y="33" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">VST+AI</text>
  <!-- WhyCavalry -->
