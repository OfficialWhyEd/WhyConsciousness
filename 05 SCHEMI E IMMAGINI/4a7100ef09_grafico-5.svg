  <text x="200" y="33" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">MCP+bridge</text>
  <!-- WhyPost -->
  <circle cx="40" cy="70" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
