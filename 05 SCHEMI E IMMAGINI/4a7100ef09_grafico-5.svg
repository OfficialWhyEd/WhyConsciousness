  <text x="40" y="75" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">agents</text>
  <!-- CLACK -->
  <circle cx="100" cy="14" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
  <text x="100" y="13" font-family="Inter,sans-serif" font-size="4" fill="#555" text-anchor="middle">CLACK</text>
  <text x="100" y="19" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">karaoke+viral</text>
  <!-- Remotion -->
  <circle cx="162" cy="14" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
  <text x="162" y="13" font-family="Inter,sans-serif" font-size="4" fill="#555" text-anchor="middle">Remotion</text>
  <text x="162" y="19" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">video</text>
  <!-- WhyCalendar -->
  <circle cx="222" cy="70" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
  <text x="222" y="69" font-family="Inter,sans-serif" font-size="4" fill="#555" text-anchor="middle">Calendar</text>
  <text x="222" y="75" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">AI+Tauri</text>
  <!-- HyperFrames -->
  <circle cx="131" cy="92" r="7" fill="#fff" stroke="#888" stroke-width=".7"/>
  <text x="131" y="91" font-family="Inter,sans-serif" font-size="4" fill="#555" text-anchor="middle">HyperF.</text>
  <text x="131" y="97" font-family="Inter,sans-serif" font-size="3" fill="#888" text-anchor="middle">gen.video</text>
  <!-- archi principali -->
  <line x1="66" y1="33" x2="122" y2="46" stroke="#b91c1c" stroke-width=".7" opacity=".5" marker-end="url(#arr)"/>
  <line x1="196" y1="33" x2="140" y2="46" stroke="#b91c1c" stroke-width=".7" opacity=".5"/>
  <line x1="46" y1="65" x2="122" y2="55" stroke="#888" stroke-width=".6" opacity=".4"/>
  <line x1="107" y1="20" x2="124" y2="44" stroke="#1d4ed8" stroke-width=".7" opacity=".4"/>
  <line x1="155" y1="20" x2="138" y2="44" stroke="#1d4ed8" stroke-width=".7" opacity=".4"/>
  <line x1="216" y1="65" x2="140" y2="55" stroke="#888" stroke-width=".6" opacity=".4"/>
  <line x1="131" y1="62" x2="131" y2="85" stroke="#888" stroke-width=".6" opacity=".4"/>
  <!-- archi tra nodi (trasferimento) -->
  <line x1="107" y1="16" x2="156" y2="16" stroke="#1d4ed8" stroke-width=".6" stroke-dasharray="2,1.5" opacity=".5"/>
  <text x="131" y="12" font-family="Inter,sans-serif" font-size="3.5" fill="#1d4ed8" text-anchor="middle">tech transfer</text>
  <line x1="66" y1="30" x2="194" y2="30" stroke="#888" stroke-width=".5" stroke-dasharray="2,2" opacity=".35"/>
  <text x="131" y="28" font-family="Inter,sans-serif" font-size="3.5" fill="#888" text-anchor="middle">bridge pattern</text>
